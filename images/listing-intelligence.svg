<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="listingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#listingBg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="35" y="35" width="730" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="55" cy="57" r="6" fill="#fbbf24" />
  <circle cx="75" cy="57" r="6" fill="#38bdf8" />
  <circle cx="95" cy="57" r="6" fill="#10b981" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#fbbf24" font-weight="600">Fabric Pipeline · Wildcard Multi-Office Ingestion &amp; Silver Upsert</text>
  <rect x="620" y="44" width="130" height="26" rx="13" fill="url(#goldAccent)" />
  <text x="685" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">REAL ESTATE ETL</text>

  <!-- Step 1: Multi-Office Landing -->
  <g transform="translate(45, 120)">
    <rect width="150" height="260" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
    <text x="75" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">LANDING ZONE</text>
    <text x="75" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Wildcard Multi-Office</text>
    <line x1="20" y1="62" x2="130" y2="62" stroke="#334155" />

    <rect x="15" y="78" width="120" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="75" y="102" font-family="sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">London / NYC / Dubai</text>

    <rect x="15" y="128" width="120" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="75" y="152" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Wildcard: *.csv</text>

    <rect x="15" y="178" width="120" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="75" y="202" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Nightly Files</text>
    <text x="75" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Ultra-Luxury Portfolios</text>
  </g>

  <!-- Step 2: Copy & Upsert -->
  <g transform="translate(225, 120)">
    <rect width="165" height="260" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="82" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">COPY &amp; UPSERT</text>
    <text x="82" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Fabric Data Factory</text>
    <line x1="20" y1="62" x2="145" y2="62" stroke="#334155" />

    <rect x="15" y="78" width="135" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="82" y="102" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Key: property_id</text>

    <rect x="15" y="128" width="135" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="82" y="152" font-family="sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">PII Exclusion Filter</text>

    <rect x="15" y="178" width="135" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="82" y="202" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Timestamp Ingestion</text>
    <text x="82" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Last-Write-Wins Rule</text>
  </g>

  <!-- Step 3: Governed Silver Delta -->
  <g transform="translate(415, 120)">
    <rect width="160" height="260" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="80" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">SILVER DELTA</text>
    <text x="80" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">OneLake Storage</text>
    <line x1="20" y1="62" x2="140" y2="62" stroke="#334155" />

    <rect x="15" y="78" width="130" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="80" y="102" font-family="monospace" font-size="10" fill="#10b981" text-anchor="middle">Silver_Listings</text>

    <rect x="15" y="128" width="130" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="80" y="152" font-family="sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Zero Duplication</text>

    <rect x="15" y="178" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="80" y="202" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Morning Deal Ready</text>
    <text x="80" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Trusted Single Source</text>
  </g>

  <!-- Step 4: Archive & Cleanse -->
  <g transform="translate(600, 120)">
    <rect width="155" height="260" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <text x="77" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">ARCHIVAL</text>
    <text x="77" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Auditable Retention</text>
    <line x1="20" y1="62" x2="135" y2="62" stroke="#334155" />

    <rect x="15" y="78" width="125" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="77" y="102" font-family="sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Archive Activity</text>

    <rect x="15" y="128" width="125" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="77" y="152" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Atomic Delete</text>

    <rect x="15" y="178" width="125" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="77" y="202" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Guaranteed Clean</text>
    <text x="77" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">0 Landing Bloat</text>
  </g>

  <!-- Footer -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#fbbf24">Microsoft Fabric Data Factory · Wildcard Copy · Upsert Delta · OneLake Archival Pipeline</text>
  </g>
</svg>