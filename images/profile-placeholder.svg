<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3440" />
      <stop offset="50%" stop-color="#3b4252" />
      <stop offset="100%" stop-color="#4c566a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88c0d0" />
      <stop offset="100%" stop-color="#5e81ac" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#88c0d0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#88c0d0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#5e81ac" stroke-width="4" />
  <circle cx="200" cy="200" r="170" fill="url(#glow)" />

  <!-- Data Flow / Circuit Lines -->
  <path d="M 50 200 H 120 L 150 160 H 250 L 280 200 H 350" stroke="#88c0d0" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6" />
  <path d="M 80 260 H 140 L 170 300 H 230 L 260 260 H 320" stroke="#81a1c1" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.4" />
  <path d="M 100 120 H 160 L 190 80 H 270" stroke="#81a1c1" stroke-width="2" stroke-dasharray="4,4" fill="none" opacity="0.4" />

  <!-- Data Nodes -->
  <circle cx="120" cy="200" r="6" fill="#88c0d0" />
  <circle cx="280" cy="200" r="6" fill="#88c0d0" />
  <circle cx="150" cy="160" r="5" fill="#81a1c1" />
  <circle cx="250" cy="160" r="5" fill="#81a1c1" />

  <!-- Professional Silhouette Icon -->
  <g transform="translate(100, 80)">
    <!-- Head -->
    <circle cx="100" cy="70" r="50" fill="#e5e9f0" />
    <!-- Glasses / Modern Engineer Detail -->
    <rect x="72" y="60" width="22" height="14" rx="3" fill="#2e3440" />
    <rect x="106" y="60" width="22" height="14" rx="3" fill="#2e3440" />
    <line x1="94" y1="67" x2="106" y2="67" stroke="#2e3440" stroke-width="3" />
    <!-- Torso / Shoulders -->
    <path d="M 20 200 C 20 145 60 135 100 135 C 140 135 180 145 180 200 Z" fill="#d8dee9" />
    <!-- Tech Badge / Collar -->
    <polygon points="100,135 85,165 115,165" fill="#5e81ac" />
  </g>

  <!-- Floating Tech Badges -->
  <rect x="40" y="310" width="130" height="34" rx="17" fill="#2e3440" stroke="#88c0d0" stroke-width="1.5" />
  <text x="105" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#eceff4" text-anchor="middle">⚡ DATA ENGINEER</text>

  <rect x="230" y="310" width="130" height="34" rx="17" fill="#2e3440" stroke="#5e81ac" stroke-width="1.5" />
  <text x="295" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#88c0d0" text-anchor="middle">☁️ FABRIC & AZURE</text>
</svg>