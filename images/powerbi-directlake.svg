<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pbiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="pbiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#pbiBg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#3f3f46" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <rect x="35" y="35" width="730" height="45" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <circle cx="55" cy="57" r="6" fill="#ef4444" />
  <circle cx="75" cy="57" r="6" fill="#f59e0b" />
  <circle cx="95" cy="57" r="6" fill="#10b981" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#fbbf24" font-weight="600">Power BI · Direct Lake Semantic Modeling &amp; Real-Time Analytics</text>
  <rect x="635" y="44" width="115" height="26" rx="13" fill="url(#pbiYellow)" />
  <text x="692" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">DIRECT LAKE</text>

  <!-- Left Side: Data Volume Metric Cards -->
  <g transform="translate(45, 100)">
    <rect width="210" height="85" rx="8" fill="#27272a" stroke="#52525b" />
    <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#a1a1aa">TOTAL ROWS ANALYZED</text>
    <text x="15" y="58" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#fbbf24">450,000,000+</text>
    <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#10b981">↑ Sub-second DAX latency</text>
  </g>

  <g transform="translate(45, 200)">
    <rect width="210" height="85" rx="8" fill="#27272a" stroke="#52525b" />
    <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#a1a1aa">DATA REFRESH TIME</text>
    <text x="15" y="58" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#38bdf8">0 SECONDS</text>
    <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#10b981">Zero-copy Delta Lake sync</text>
  </g>

  <g transform="translate(45, 300)">
    <rect width="210" height="85" rx="8" fill="#27272a" stroke="#52525b" />
    <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#a1a1aa">STORAGE SAVINGS</text>
    <text x="15" y="58" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#a855f7">70% REDUCED</text>
    <text x="15" y="75" font-family="sans-serif" font-size="10" fill="#10b981">Eliminated duplicate import models</text>
  </g>

  <!-- Right Side: Dashboard Visualization Mockup -->
  <g transform="translate(275, 100)">
    <rect width="480" height="285" rx="10" fill="#18181b" stroke="#3f3f46" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Executive Revenue &amp; Supply Chain Telemetry</text>

    <!-- Bar Chart Visual -->
    <rect x="25" y="55" width="210" height="130" rx="6" fill="#27272a" stroke="#3f3f46" />
    <text x="35" y="75" font-family="sans-serif" font-size="10" fill="#a1a1aa">Monthly Throughput (TBs)</text>
    <rect x="35" y="145" width="18" height="30" fill="#5e81ac" rx="2" />
    <rect x="60" y="125" width="18" height="50" fill="#5e81ac" rx="2" />
    <rect x="85" y="110" width="18" height="65" fill="#5e81ac" rx="2" />
    <rect x="110" y="95" width="18" height="80" fill="#88c0d0" rx="2" />
    <rect x="135" y="90" width="18" height="85" fill="#88c0d0" rx="2" />
    <rect x="160" y="80" width="18" height="95" fill="#fbbf24" rx="2" />
    <rect x="185" y="70" width="18" height="105" fill="#fbbf24" rx="2" />

    <!-- Donut Chart Visual -->
    <rect x="250" y="55" width="205" height="130" rx="6" fill="#27272a" stroke="#3f3f46" />
    <text x="260" y="75" font-family="sans-serif" font-size="10" fill="#a1a1aa">Cost by Lakehouse Layer</text>
    <circle cx="350" cy="130" r="40" fill="none" stroke="#5e81ac" stroke-width="16" />
    <circle cx="350" cy="130" r="40" fill="none" stroke="#fbbf24" stroke-width="16" stroke-dasharray="100 150" />
    <circle cx="350" cy="130" r="40" fill="none" stroke="#10b981" stroke-width="16" stroke-dasharray="60 190" />

    <!-- Table Preview -->
    <rect x="25" y="200" width="430" height="70" rx="6" fill="#27272a" stroke="#3f3f46" />
    <text x="35" y="220" font-family="monospace" font-size="10" fill="#fbbf24">DIM_CUSTOMER | FACT_SALES | DELTA_VORDER | DAX_EVAL_MS</text>
    <line x1="35" y1="228" x2="445" y2="228" stroke="#3f3f46" />
    <text x="35" y="245" font-family="monospace" font-size="10" fill="#a1a1aa">Enterprise EMEA    | 12.4M rows   | ENABLED      | 142 ms</text>
    <text x="35" y="260" font-family="monospace" font-size="10" fill="#a1a1aa">North America East | 34.8M rows   | ENABLED      | 195 ms</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#fbbf24">Power BI · Direct Lake · DAX Optimization · Tabular Editor · Star Schema · Microsoft Fabric OneLake</text>
  </g>
