<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#dfBg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#4338ca" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="35" y="35" width="730" height="45" rx="8" fill="#312e81" stroke="#4338ca" stroke-width="1" />
  <circle cx="55" cy="57" r="6" fill="#a855f7" />
  <circle cx="75" cy="57" r="6" fill="#818cf8" />
  <circle cx="95" cy="57" r="6" fill="#38bdf8" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#c084fc" font-weight="600">Fabric Dataflow Gen2 · Power Query M &amp; Customer 360 Curation</text>
  <rect x="620" y="44" width="130" height="26" rx="13" fill="url(#purpleGrad)" />
  <text x="685" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DATAFLOW GEN2</text>

  <!-- Step 1: Raw Bronze Ingestion -->
  <g transform="translate(45, 120)">
    <rect width="150" height="260" rx="10" fill="#312e81" stroke="#a855f7" stroke-width="2" />
    <text x="75" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">BRONZE SOURCE</text>
    <text x="75" y="52" font-family="sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">Uncurated CRM Files</text>
    <line x1="20" y1="62" x2="130" y2="62" stroke="#4338ca" />

    <rect x="15" y="78" width="120" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="75" y="102" font-family="sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">6 Address Suffixes</text>

    <rect x="15" y="128" width="120" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="75" y="152" font-family="sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">Mixed State Codes</text>

    <rect x="15" y="178" width="120" height="60" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="75" y="202" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Malformed Phones</text>
    <text x="75" y="222" font-family="sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">Dashes, Dots &amp; Brackets</text>
  </g>

  <!-- Step 2: Dataflow Gen2 M Transformations -->
  <g transform="translate(225, 120)">
    <rect width="165" height="260" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <text x="82" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">M SCRIPT CLEANSE</text>
    <text x="82" y="52" font-family="sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">Dataflow Gen2 Engine</text>
    <line x1="20" y1="62" x2="145" y2="62" stroke="#4338ca" />

    <rect x="15" y="78" width="135" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="82" y="102" font-family="monospace" font-size="10" fill="#818cf8" text-anchor="middle">Text.Select(digits)</text>

    <rect x="15" y="128" width="135" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="82" y="152" font-family="sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">Table.NestedJoin</text>

    <rect x="15" y="178" width="135" height="60" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="82" y="202" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Reference Lookups</text>
    <text x="82" y="222" font-family="sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">State &amp; Postal Standards</text>
  </g>

  <!-- Step 3: Fast Copy & Lakehouse Staging -->
  <g transform="translate(415, 120)">
    <rect width="160" height="260" rx="10" fill="#312e81" stroke="#38bdf8" stroke-width="2" />
    <text x="80" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">FAST COPY ENGINE</text>
    <text x="80" y="52" font-family="sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">High-Throughput Load</text>
    <line x1="20" y1="62" x2="140" y2="62" stroke="#4338ca" />

    <rect x="15" y="78" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="80" y="102" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Parallel Partitioning</text>

    <rect x="15" y="128" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="80" y="152" font-family="sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">Staging Lakehouse</text>

    <rect x="15" y="178" width="130" height="60" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="80" y="202" font-family="sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">Auto Compute Scaling</text>
    <text x="80" y="222" font-family="sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">Zero Gateway Choke</text>
  </g>

  <!-- Step 4: Governed Customer Silver -->
  <g transform="translate(600, 120)">
    <rect width="155" height="260" rx="10" fill="#312e81" stroke="#10b981" stroke-width="2" />
    <text x="77" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">CUSTOMER SILVER</text>
    <text x="77" y="52" font-family="sans-serif" font-size="10" fill="#c7d2fe" text-anchor="middle">Trusted Contract</text>
    <line x1="20" y1="62" x2="135" y2="62" stroke="#4338ca" />

    <rect x="15" y="78" width="125" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="77" y="102" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="middle">Customer 360 Ready</text>

    <rect x="15" y="128" width="125" height="40" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="77" y="152" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Standard 10-Digit</text>

    <rect x="15" y="178" width="125" height="60" rx="6" fill="#1e1b4b" stroke="#4338ca" />
    <text x="77" y="202" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">100% Valid Roster</text>
    <text x="77" y="222" font-family="sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">Churn Model Boost</text>
  </g>

  <!-- Footer -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#312e81" stroke="#4338ca" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#c084fc">Microsoft Fabric Dataflow Gen2 · Power Query M · Delta Lake · Customer 360 · Fast Copy</text>
  </g>
</svg>