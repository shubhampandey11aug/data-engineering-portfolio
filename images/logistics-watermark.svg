<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="logBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1e33" />
      <stop offset="100%" stop-color="#1b3a4b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#118ab2" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#logBg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#2c5d75" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="35" y="35" width="730" height="45" rx="8" fill="#142d3d" stroke="#2c5d75" stroke-width="1" />
  <circle cx="55" cy="57" r="6" fill="#06d6a0" />
  <circle cx="75" cy="57" r="6" fill="#118ab2" />
  <circle cx="95" cy="57" r="6" fill="#ffd166" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#06d6a0" font-weight="600">Fabric Incremental Pipeline · Watermark State Persistence &amp; Append-Only Delta</text>
  <rect x="620" y="44" width="130" height="26" rx="13" fill="url(#cyanGrad)" />
  <text x="685" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0c1e33" text-anchor="middle">WATERMARK ETL</text>

  <!-- Step 1: Central Lakehouse Raw Ingestion -->
  <g transform="translate(45, 120)">
    <rect width="150" height="260" rx="10" fill="#142d3d" stroke="#118ab2" stroke-width="2" />
    <text x="75" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4ea8de" text-anchor="middle">RAW JSON LANDING</text>
    <text x="75" y="52" font-family="sans-serif" font-size="10" fill="#a2d2ff" text-anchor="middle">Global Shipment Logs</text>
    <line x1="20" y1="62" x2="130" y2="62" stroke="#2c5d75" />

    <rect x="15" y="78" width="120" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="75" y="102" font-family="sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">DHL / FedEx Feeds</text>

    <rect x="15" y="128" width="120" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="75" y="152" font-family="sans-serif" font-size="10" fill="#ffd166" text-anchor="middle">Timestamp Metadata</text>

    <rect x="15" y="178" width="120" height="60" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="75" y="202" font-family="sans-serif" font-size="10" fill="#06d6a0" text-anchor="middle">100s of Daily Logs</text>
    <text x="75" y="222" font-family="sans-serif" font-size="9" fill="#a2d2ff" text-anchor="middle">High Velocity Supply</text>
  </g>

  <!-- Step 2: Watermark State Evaluation -->
  <g transform="translate(225, 120)">
    <rect width="165" height="260" rx="10" fill="#142d3d" stroke="#ffd166" stroke-width="2" />
    <text x="82" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffd166" text-anchor="middle">STATE TRACKING</text>
    <text x="82" y="52" font-family="sans-serif" font-size="10" fill="#a2d2ff" text-anchor="middle">Delta Watermark Table</text>
    <line x1="20" y1="62" x2="145" y2="62" stroke="#2c5d75" />

    <rect x="15" y="78" width="135" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="82" y="102" font-family="monospace" font-size="10" fill="#ffd166" text-anchor="middle">LastProcessedDate</text>

    <rect x="15" y="128" width="135" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="82" y="152" font-family="sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">Filter: Time &gt; Watermark</text>

    <rect x="15" y="178" width="135" height="60" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="82" y="202" font-family="sans-serif" font-size="10" fill="#06d6a0" text-anchor="middle">Net-New Files Only</text>
    <text x="82" y="222" font-family="sans-serif" font-size="9" fill="#a2d2ff" text-anchor="middle">Zero Duplicate Scan</text>
  </g>

  <!-- Step 3: Append-Only Delta Execution -->
  <g transform="translate(415, 120)">
    <rect width="160" height="260" rx="10" fill="#142d3d" stroke="#06d6a0" stroke-width="2" />
    <text x="80" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#06d6a0" text-anchor="middle">DELTA APPEND</text>
    <text x="80" y="52" font-family="sans-serif" font-size="10" fill="#a2d2ff" text-anchor="middle">ACID Event Timeline</text>
    <line x1="20" y1="62" x2="140" y2="62" stroke="#2c5d75" />

    <rect x="15" y="78" width="130" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="80" y="102" font-family="monospace" font-size="10" fill="#06d6a0" text-anchor="middle">ShippingLogs Delta</text>

    <rect x="15" y="128" width="130" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="80" y="152" font-family="sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">In-Transit → Delayed</text>

    <rect x="15" y="178" width="130" height="60" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="80" y="202" font-family="sans-serif" font-size="10" fill="#ffd166" text-anchor="middle">Preserve History</text>
    <text x="80" y="222" font-family="sans-serif" font-size="9" fill="#a2d2ff" text-anchor="middle">Full Status Lineage</text>
  </g>

  <!-- Step 4: Advance Watermark & Time Travel -->
  <g transform="translate(600, 120)">
    <rect width="155" height="260" rx="10" fill="#142d3d" stroke="#118ab2" stroke-width="2" />
    <text x="77" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#4ea8de" text-anchor="middle">RELIABILITY</text>
    <text x="77" y="52" font-family="sans-serif" font-size="10" fill="#a2d2ff" text-anchor="middle">Idempotent &amp; Audit</text>
    <line x1="20" y1="62" x2="135" y2="62" stroke="#2c5d75" />

    <rect x="15" y="78" width="125" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="77" y="102" font-family="sans-serif" font-size="10" fill="#06d6a0" text-anchor="middle">Advance On Success</text>

    <rect x="15" y="128" width="125" height="40" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="77" y="152" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Delta Time Travel</text>

    <rect x="15" y="178" width="125" height="60" rx="6" fill="#0c1e33" stroke="#2c5d75" />
    <text x="77" y="202" font-family="sans-serif" font-size="10" fill="#ffd166" text-anchor="middle">0 SLA Breaches</text>
    <text x="77" y="222" font-family="sans-serif" font-size="9" fill="#a2d2ff" text-anchor="middle">Automated Operations</text>
  </g>

  <!-- Footer -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#142d3d" stroke="#2c5d75" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#06d6a0">Microsoft Fabric · Delta Lake · Watermark State Persistence · Append Semantics · Time Travel</text>
  </g>
</svg>