<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="50%" stop-color="#5e81ac" />
      <stop offset="100%" stop-color="#88c0d0" />
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cd7f32" />
      <stop offset="100%" stop-color="#8c531b" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="35" y="35" width="730" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <circle cx="55" cy="57" r="6" fill="#ef4444" />
  <circle cx="75" cy="57" r="6" fill="#f59e0b" />
  <circle cx="95" cy="57" r="6" fill="#10b981" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#94a3b8" font-weight="600">Microsoft Fabric · OneLake Medallion Lakehouse Architecture</text>
  <rect x="640" y="44" width="110" height="26" rx="13" fill="#0284c7" />
  <text x="695" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ACTIVE PIPELINE</text>

  <!-- Ingestion Source -->
  <g transform="translate(45, 120)">
    <rect width="130" height="260" rx="10" fill="#1e293b" stroke="#5e81ac" stroke-width="2" />
    <text x="65" y="35" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#88c0d0" text-anchor="middle">DATA SOURCES</text>
    <line x1="20" y1="48" x2="110" y2="48" stroke="#334155" />

    <rect x="15" y="65" width="100" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="65" y="89" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">REST APIs</text>

    <rect x="15" y="115" width="100" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="65" y="139" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Azure SQL / OLTP</text>

    <rect x="15" y="165" width="100" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="65" y="189" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Event Hubs (Kafka)</text>

    <rect x="15" y="215" width="100" height="30" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" />
    <text x="65" y="235" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Fabric Data Factory</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 180 250 L 215 250" stroke="#88c0d0" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="5,3" />

  <!-- Bronze Layer -->
  <g transform="translate(220, 120)">
    <rect width="140" height="260" rx="10" fill="#1e293b" stroke="#cd7f32" stroke-width="2" />
    <rect x="10" y="10" width="120" height="28" rx="14" fill="url(#bronze)" />
    <text x="70" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BRONZE LAYER</text>
    <text x="70" y="60" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Raw Ingestion</text>

    <rect x="15" y="75" width="110" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="99" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Delta Lake Tables</text>

    <rect x="15" y="125" width="110" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="149" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Schema Validation</text>

    <rect x="15" y="175" width="110" height="65" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="198" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Fabric Notebook</text>
    <text x="70" y="222" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">PySpark / Delta</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 365 250 L 400 250" stroke="#88c0d0" stroke-width="3" stroke-dasharray="5,3" />

  <!-- Silver Layer -->
  <g transform="translate(405, 120)">
    <rect width="140" height="260" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
    <rect x="10" y="10" width="120" height="28" rx="14" fill="url(#silver)" />
    <text x="70" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">SILVER LAYER</text>
    <text x="70" y="60" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Cleansed & Enriched</text>

    <rect x="15" y="75" width="110" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="99" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Deduplication & QC</text>

    <rect x="15" y="125" width="110" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="149" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">SCD Type 2 Hist</text>

    <rect x="15" y="175" width="110" height="65" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="70" y="198" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">V-Order Optimize</text>
    <text x="70" y="222" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Z-Order Indexing</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 550 250 L 585 250" stroke="#88c0d0" stroke-width="3" stroke-dasharray="5,3" />

  <!-- Gold Layer & Power BI -->
  <g transform="translate(590, 120)">
    <rect width="165" height="260" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
    <rect x="10" y="10" width="145" height="28" rx="14" fill="url(#gold)" />
    <text x="82" y="29" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">GOLD & POWER BI</text>
    <text x="82" y="60" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Aggregated Star Schema</text>

    <rect x="15" y="75" width="135" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="82" y="99" font-family="sans-serif" font-size="11" fill="#facc15" text-anchor="middle">Fabric Warehouse / SQL</text>

    <rect x="15" y="125" width="135" height="50" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" />
    <text x="82" y="146" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">Power BI Direct Lake</text>
    <text x="82" y="164" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Zero-Copy Sub-second DAX</text>

    <rect x="15" y="185" width="135" height="55" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="82" y="206" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">⚡ 85% Refresh Reduction</text>
    <text x="82" y="226" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">📊 Real-Time Semantic</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#88c0d0">Tech Stack: Microsoft Fabric · OneLake · PySpark · Delta Lake · T-SQL · Direct Lake · Data Factory</text>
  </g>
</svg>