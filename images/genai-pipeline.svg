<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#aiBg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#2a3b5c" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="35" y="35" width="730" height="45" rx="8" fill="#141c2e" stroke="#2a3b5c" stroke-width="1" />
  <circle cx="55" cy="57" r="6" fill="#ec4899" />
  <circle cx="75" cy="57" r="6" fill="#8b5cf6" />
  <circle cx="95" cy="57" r="6" fill="#06b6d4" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#c084fc" font-weight="600">Azure + Generative AI · RAG Ingestion Pipeline &amp; Vector Lakehouse</text>
  <rect x="620" y="44" width="130" height="26" rx="13" fill="url(#aiPurple)" />
  <text x="685" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GENAI + DATA ENG</text>

  <!-- Step 1: Unstructured Docs -->
  <g transform="translate(45, 120)">
    <rect width="150" height="260" rx="10" fill="#141c2e" stroke="#8b5cf6" stroke-width="2" />
    <text x="75" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">INGESTION</text>
    <text x="75" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Unstructured Data</text>
    <line x1="20" y1="62" x2="130" y2="62" stroke="#2a3b5c" />

    <rect x="15" y="78" width="120" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="75" y="102" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">PDFs / Contracts</text>

    <rect x="15" y="128" width="120" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="75" y="152" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">SQL Schema Docs</text>

    <rect x="15" y="178" width="120" height="60" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="75" y="202" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">ADLS Gen2 Landing</text>
    <text x="75" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Event-Triggered ADF</text>
  </g>

  <!-- Step 2: Chunking & PySpark -->
  <g transform="translate(225, 120)">
    <rect width="165" height="260" rx="10" fill="#141c2e" stroke="#ec4899" stroke-width="2" />
    <text x="82" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">PROCESSING</text>
    <text x="82" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">PySpark Chunking</text>
    <line x1="20" y1="62" x2="145" y2="62" stroke="#2a3b5c" />

    <rect x="15" y="78" width="135" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="82" y="102" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Semantic Chunking</text>

    <rect x="15" y="128" width="135" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="82" y="152" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Token Batching</text>

    <rect x="15" y="178" width="135" height="60" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="82" y="202" font-family="sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Metadata Injection</text>
    <text x="82" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Lineage &amp; RBAC Tags</text>
  </g>

  <!-- Step 3: Embeddings & Vector Lakehouse -->
  <g transform="translate(415, 120)">
    <rect width="160" height="260" rx="10" fill="#141c2e" stroke="#06b6d4" stroke-width="2" />
    <text x="80" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#22d3ee" text-anchor="middle">VECTOR EMBEDDING</text>
    <text x="80" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Azure OpenAI &amp; AI Search</text>
    <line x1="20" y1="62" x2="140" y2="62" stroke="#2a3b5c" />

    <rect x="15" y="78" width="130" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="80" y="102" font-family="monospace" font-size="10" fill="#22d3ee" text-anchor="middle">text-embedding-3</text>

    <rect x="15" y="128" width="130" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="80" y="152" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Vector Indexing</text>

    <rect x="15" y="178" width="130" height="60" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="80" y="202" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Delta Lake Vectors</text>
    <text x="80" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Cosine Similarity</text>
  </g>

  <!-- Step 4: AI Copilot & Querying -->
  <g transform="translate(600, 120)">
    <rect width="155" height="260" rx="10" fill="#141c2e" stroke="#10b981" stroke-width="2" />
    <text x="77" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">ENTERPRISE RAG</text>
    <text x="77" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Natural Language SQL</text>
    <line x1="20" y1="62" x2="135" y2="62" stroke="#2a3b5c" />

    <rect x="15" y="78" width="125" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="77" y="102" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Text-to-SQL Copilot</text>

    <rect x="15" y="128" width="125" height="40" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="77" y="152" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Zero-Hallucination</text>

    <rect x="15" y="178" width="125" height="60" rx="6" fill="#090d16" stroke="#2a3b5c" />
    <text x="77" y="202" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Real-Time Answers</text>
    <text x="77" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Governance &amp; RBAC</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#141c2e" stroke="#2a3b5c" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#c084fc">Azure OpenAI · Vector Search · PySpark · Microsoft Fabric Lakehouse · LangChain · Delta Lake</text>
  </g>
</svg>