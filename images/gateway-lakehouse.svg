    <rect x="15" y="128" width="130" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="80" y="152" font-family="sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Set Variable Audit</text>

    <rect x="15" y="178" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="80" y="202" font-family="sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">On-Demand Trigger</text>
    <text x="80" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Supervisor Portal</text>
