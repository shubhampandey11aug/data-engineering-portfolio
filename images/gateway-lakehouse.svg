    <text x="77" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Delta Lake Tables</text>
    <line x1="20" y1="62" x2="135" y2="62" stroke="#334155" />

    <rect x="15" y="78" width="125" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="77" y="102" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Inventory Delta</text>

    <rect x="15" y="128" width="125" height="40" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="77" y="152" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Audit Logs Delta</text>

    <rect x="15" y="178" width="125" height="60" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="77" y="202" font-family="sans-serif" font-size="10" fill="#a78bfa" text-anchor="middle">Direct Lake Ready</text>
    <text x="77" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Zero Latency BI</text>
  </g>

  <!-- Footer -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#38bdf8">On-premises Data Gateway · PostgreSQL · Fabric Data Factory · Delta Lake · Audit Trail Logging</text>
  </g>
