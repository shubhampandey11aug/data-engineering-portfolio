    <text x="82" y="202" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Service Bus Relay</text>
    <text x="82" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">High Availability</text>
