    <text x="75" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">RegionMapping.csv</text>
  </g>

  <!-- Step 2: Silver Layer PySpark -->
  <g transform="translate(225, 120)">
    <rect width="165" height="260" rx="10" fill="#143447" stroke="#c0c0c0" stroke-width="2" />
    <text x="82" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0" text-anchor="middle">SILVER LAYER</text>
    <text x="82" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Enriched Delta Tables</text>
    <line x1="20" y1="62" x2="145" y2="62" stroke="#25536e" />

    <rect x="15" y="78" width="135" height="40" rx="6" fill="#091e2b" stroke="#25536e" />
