  <circle cx="75" cy="57" r="6" fill="#c0c0c0" />
  <circle cx="95" cy="57" r="6" fill="#ffd700" />
  <text x="120" y="62" font-family="'Segoe UI', Roboto, monospace" font-size="14" fill="#38bdf8" font-weight="600">Fabric Medallion Architecture · Bronze ➔ Silver ➔ Gold Star Schema</text>
  <rect x="620" y="44" width="130" height="26" rx="13" fill="url(#retailGrad)" />
  <text x="685" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">COMMERCE LAKE</text>

  <!-- Step 1: Bronze Ingestion -->
  <g transform="translate(45, 120)">
