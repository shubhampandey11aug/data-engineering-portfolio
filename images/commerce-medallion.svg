    <text x="75" y="32" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#f97316" text-anchor="middle">BRONZE LAYER</text>
    <text x="75" y="52" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Raw Azure SQL Extract</text>
    <line x1="20" y1="62" x2="130" y2="62" stroke="#25536e" />

    <rect x="15" y="78" width="120" height="40" rx="6" fill="#091e2b" stroke="#25536e" />
    <text x="75" y="102" font-family="sans-serif" font-size="10" fill="#f8fafc" text-anchor="middle">Lookup + ForEach</text>

    <rect x="15" y="128" width="120" height="40" rx="6" fill="#091e2b" stroke="#25536e" />
    <text x="75" y="152" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Raw Relational Copy</text>

    <rect x="15" y="178" width="120" height="60" rx="6" fill="#091e2b" stroke="#25536e" />
