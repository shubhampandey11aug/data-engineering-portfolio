<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e2b" />
      <stop offset="100%" stop-color="#143447" />
    </linearGradient>
    <linearGradient id="retailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#commBg)" />
  <rect x="20" y="20" width="760" height="440" rx="12" fill="none" stroke="#25536e" stroke-width="1.5" />

