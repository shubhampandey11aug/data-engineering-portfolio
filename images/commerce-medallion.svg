  <!-- Footer -->
  <g transform="translate(45, 400)">
    <rect width="710" height="40" rx="6" fill="#143447" stroke="#25536e" />
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#ffd700">Microsoft Fabric · Medallion Architecture · PySpark · Delta Lake · Direct Lake Power BI</text>
