    <text x="80" y="202" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Dim_Date &amp; Dim_Cust</text>
    <text x="80" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">SQL Analytics Endpoint</text>
