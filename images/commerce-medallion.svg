    <text x="77" y="152" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Sub-Second DAX</text>

    <rect x="15" y="178" width="125" height="60" rx="6" fill="#091e2b" stroke="#25536e" />
    <text x="77" y="202" font-family="sans-serif" font-size="10" fill="#ffd700" text-anchor="middle">Executive Dashboards</text>
    <text x="77" y="222" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Cent-Level Exact Match</text>
